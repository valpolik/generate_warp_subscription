name: Update WARP AmneziaWG Subscription

on:
  schedule:
    # Каждые 5 минут, со сдвигом со старта часа (2, 7, 12, ... 57),
    # чтобы не попадать в пиковую нагрузку GitHub Actions на минуте 0.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: # ручной запуск для отладки

# Гарантирует, что в группе одновременно выполняется только ОДИН запуск.
# Новый запуск встаёт в очередь; если в очереди уже есть один ожидающий,
# промежуточные пропускаются (skipped) — это защищает от конфликтов при git push.
concurrency:
  group: ${{ github.workflow }}-subscription-update
  cancel-in-progress: false

permissions:
  contents: write # обязательно для коммита файлов обратно в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest
    # Принудительно останавливаем «зависший» запуск через 5 минут,
    # чтобы не блокировать очередь concurrency и не жечь минуты (для приватных репо).
    timeout-minutes: 15

    steps:
      - name: Log trigger context
        run: |
          echo "Event:        ${{ github.event_name }}"
          echo "Schedule:     ${{ github.event.schedule }}"
          echo "Workflow:     ${{ github.workflow }}"
          echo "Run number:   ${{ github.run_number }}"
          echo "UTC time:     $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate subscription files
        run: python generate_warp_subscription.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Добавляем все три файла подписки. Если какого-то нет (скрипт упал раньше),
          # git add просто проигнорирует отсутствующий файл.
          git add warp-awg-links.txt warp-awg-configs.zip warp-awg-container.json

          # Если изменений нет — выходим без коммита и без ошибки.
          if git diff --staged --quiet; then
            echo "Нет изменений — пропускаем коммит."
            exit 0
          fi

          # [skip ci] предотвращает повторный запуск этого же workflow
          # от события push, которое возникает после нашего коммита.
          git commit -m "chore: update WARP AmneziaWG subscription [skip ci]"

          # Пуш с защитой от гонки: если удалённая ветка ушла вперёд
          # (например, из-за ручного коммита), повторяем один раз после rebase.
          if ! git push; then
            echo "Push отклонён — пробуем rebase и повторный push."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
